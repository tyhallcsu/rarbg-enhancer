name: Feature request
description: Suggest a new control, filter, or quality-of-life improvement.
title: "[feat] "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        One feature per issue, please. Big ideas can be split — link them in a checklist.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the proposed implementation. "I want to skip rows below 50 seeders without losing the highlighting on rows above 1000" is more useful than "add a low-seeder hide checkbox."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd like it to work from the user's POV. Sketch the modal control, the keyboard shortcut, the persistence key — whatever's relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, and why you ruled them out.
    validations:
      required: false

  - type: textarea
    id: mirrors
    attributes:
      label: Mirror compatibility notes
      description: Does this depend on a specific mirror's HTML quirks? Does it interact with the v5 column-detection algorithm? Anything we should test on `rarbg.to` vs `rarbgmirror.org`?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - highlighter
        - filters
        - modal
        - performance
        - settings
        - docs
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Mockups, links to similar features in other userscripts, etc.
    validations:
      required: false
